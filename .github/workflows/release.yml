name: Release Baudix

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Baudix_Setup_v1.1.7.exe
          - os: ubuntu-latest
            artifact: baudix-linux.zip

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.3'
          modules: 'qtserialport'

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y build-essential libgl1-mesa-dev

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Project
        run: cmake --build build --config Release

      - name: Package Windows
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          if [ -f "build/Release/baudix.exe" ]; then
            windeployqt --release build/Release/baudix.exe
            "C:/Program Files (x86)/Inno Setup 6/ISCC.exe" baudix_setup.iss
            cp Output/Baudix_Setup_v1.1.7.exe ${{ matrix.artifact }}
          elif [ -f "build/baudix.exe" ]; then
            windeployqt --release build/baudix.exe
            # Adjust installer.iss on the fly if path is different
            sed -i 's|build\\Release|build|g' baudix_setup.iss
            "C:/Program Files (x86)/Inno Setup 6/ISCC.exe" baudix_setup.iss
            cp Output/Baudix_Setup_v1.1.7.exe ${{ matrix.artifact }}
          else
            echo "Executable not found!"
            exit 1
          fi

      - name: Package Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          zip -j ${{ matrix.artifact }} build/baudix

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ matrix.artifact }}
