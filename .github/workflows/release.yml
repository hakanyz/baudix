name: Release Baudix

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_path: 'Output/Baudix_Setup_*.exe'
          - os: ubuntu-latest
            artifact_path: 'build/*.deb'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.3'
          modules: 'qtserialport'

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y build-essential libgl1-mesa-dev

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Project
        run: cmake --build build --config Release

      - name: Package Windows
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          if [ -f "build/Release/baudix.exe" ]; then
            windeployqt --release build/Release/baudix.exe
            "C:/Program Files (x86)/Inno Setup 6/ISCC.exe" baudix_setup.iss
          elif [ -f "build/baudix.exe" ]; then
            windeployqt --release build/baudix.exe
            # Adjust installer.iss on the fly if path is different
            sed -i 's|build\\Release|build|g' baudix_setup.iss
            "C:/Program Files (x86)/Inno Setup 6/ISCC.exe" baudix_setup.iss
          else
            echo "Executable not found!"
            exit 1
          fi

      - name: Package Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd build
          cpack -G DEB

      - name: Upload Artifacts for Release
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      
      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v1
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
